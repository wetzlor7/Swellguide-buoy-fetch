name: Sync Buoys and Forecast

on:
  schedule:
    - cron: '0 */2 * * *'   # Alle 30 Min (Aktive Bojen)
    - cron: '15 4 * * 1'     # Jeden Montag (Probe-Run inaktive Bojen)
  workflow_dispatch:
    inputs:
      probe_mode:
        description: 'Als Probe-Run ausführen?'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: pip install copernicusmarine supabase pandas requests xarray netCDF4 h5netcdf
      - name: Run Buoy Sync
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROBE_MODE: ${{ github.event.schedule == '15 4 * * 1' || github.event.inputs.probe_mode == 'true' }}
        run: python buoy_sync.py
